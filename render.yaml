services:
  - type: web
    name: ayyar-smart-trader-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEFAULT_RISK_PER_TRADE
        value: "0.01"
      - key: MAX_DAILY_LOSS
        value: "0.03"
      - key: MAX_DRAWDOWN
        value: "0.08"
