services:
  - type: web
    name: ayyar-smart-trader-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TALASANJ_KEY
        sync: false
      - key: METALS_DEV_KEY
        sync: false
      - key: DEFAULT_RISK_PER_TRADE
        value: "0.01"
      - key: MAX_DAILY_LOSS
        value: "0.03"
      - key: MAX_DRAWDOWN
        value: "0.08"
  - type: worker
    name: ayyar-smart-trader-telegram
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_BASE_URL
        value: https://ayyar-smart-trader-api.onrender.com
