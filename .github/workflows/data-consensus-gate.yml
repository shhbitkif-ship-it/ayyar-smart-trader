name: Live data consensus safety gate

on:
  pull_request:
    paths:
      - ".github/workflows/data-consensus-gate.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/data-consensus-gate.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read

jobs:
  verify-live-consensus:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify multi-timeframe data quality and fail-closed signal behavior
        run: |
          python - <<'PY'
          import json
          import math
          import urllib.request
          from datetime import datetime, timezone

          base = "https://ayyar-smart-trader-api.ayyar-smart-trader.workers.dev"

          # Read-only provider contract probes. These never feed the trading engine.
          probes = {
              "xaus_chart_15m": "https://xaus.com/api/v1/chart?symbol=xau&range=5d&interval=15m",
              "xaus_chart_60m": "https://xaus.com/api/v1/chart?symbol=xau&range=3mo&interval=60m",
              "xaus_chart_1d": "https://xaus.com/api/v1/chart?symbol=xau&range=1y&interval=1d",
              "xaus_intraday_48h": "https://xaus.com/api/v1/intraday?symbol=xau&hours=48",
              "xaus_spot": "https://xaus.com/api/v1/spot",
              "biquote_health": "https://biquote.io/health",
              "biquote_quote": "https://biquote.io/api/XAUUSD?allowStale=false",
              "biquote_ohlc_15m": "https://biquote.io/api/XAUUSD/ohlc?interval=15m&limit=192",
              "biquote_ohlc_60m": "https://biquote.io/api/XAUUSD/ohlc?interval=1h&limit=168",
              "biquote_ohlc_1d": "https://biquote.io/api/XAUUSD/ohlc?interval=1d&limit=180"
          }
          for name, url in probes.items():
              try:
                  probe_request = urllib.request.Request(url, headers={
                      "Accept": "application/json",
                      "User-Agent": "Mozilla/5.0 AyyarSmartTrader-ProviderProbe/1.0"
                  })
                  with urllib.request.urlopen(probe_request, timeout=15) as probe_response:
                      raw = probe_response.read(120000).decode("utf-8", errors="replace")
                      data = json.loads(raw)
                      now_epoch = datetime.now(timezone.utc).timestamp()
                      points = data.get("points") if isinstance(data, dict) and isinstance(data.get("points"), list) else []
                      bars = data.get("bars") if isinstance(data, dict) and isinstance(data.get("bars"), list) else []
                      completed_bars = [bar for bar in bars if isinstance(bar, dict) and bar.get("isOpen") is False]
                      last_bar = max(completed_bars, key=lambda bar: str(bar.get("openTime") or ""), default=None)
                      last_point_timestamp = points[-1].get("t") if points and isinstance(points[-1], dict) else None
                      last_bar_close_age_seconds = None
                      if last_bar and isinstance(last_bar.get("openTime"), str):
                          try:
                              bar_open = datetime.fromisoformat(last_bar["openTime"].replace("Z", "+00:00"))
                              interval_name = data.get("interval")
                              interval_seconds = {"15m": 900, "1h": 3600, "1d": 86400}.get(interval_name)
                              if bar_open.tzinfo is not None and interval_seconds:
                                  last_bar_close_age_seconds = round((datetime.now(timezone.utc) - bar_open.astimezone(timezone.utc)).total_seconds() - interval_seconds, 1)
                          except ValueError:
                              pass
                      point_age_seconds = (
                          round(now_epoch - last_point_timestamp, 1)
                          if isinstance(last_point_timestamp, (int, float)) and not isinstance(last_point_timestamp, bool)
                          else None
                      )
                      state = data.get("data_state") if isinstance(data, dict) else None
                      state = state if isinstance(state, dict) else {}
                      state_as_of = state.get("as_of")
                      try:
                          parsed_as_of = datetime.fromisoformat(state_as_of.replace("Z", "+00:00"))
                          if parsed_as_of.tzinfo is None:
                              parsed_as_of = parsed_as_of.replace(tzinfo=timezone.utc)
                          state_age_seconds = round((datetime.now(timezone.utc) - parsed_as_of.astimezone(timezone.utc)).total_seconds(), 1)
                      except (AttributeError, TypeError, ValueError):
                          state_age_seconds = None
                      print("UPSTREAM_PROBE", name, json.dumps({
                          "http": probe_response.status,
                          "keys": list(data.keys())[:25] if isinstance(data, dict) else [],
                          "data_state": state or None,
                          "state_as_of_age_seconds": state_age_seconds,
                          "updated_at": data.get("updated_at") if isinstance(data, dict) else None,
                          "price_as_of": data.get("price_as_of") if isinstance(data, dict) else None,
                          "point_count": len(points),
                          "last_points": points[-3:],
                          "last_point_timestamp": last_point_timestamp,
                          "last_point_age_seconds": point_age_seconds,
                          "bar_count": len(bars),
                          "completed_bar_count": len(completed_bars),
                          "last_completed_bar": last_bar,
                          "last_bar_close_age_seconds": last_bar_close_age_seconds,
                          "quote_timestamp": data.get("timestamp") if isinstance(data, dict) else None,
                          "quote_mid": data.get("mid") if isinstance(data, dict) else None,
                          "quote_state": data.get("marketState") if isinstance(data, dict) else None,
                          "error": data.get("error") if isinstance(data, dict) else "Unexpected JSON root type"
                      }, ensure_ascii=False))
              except Exception as error:
                  print("UPSTREAM_PROBE", name, json.dumps({"error": str(error)[:400]}))

          request = urllib.request.Request(
              base + "/v1/signals/multi-timeframe?symbol=xau",
              headers={"Accept": "application/json", "User-Agent": "AyyarSmartTrader-ConsensusGate/1.0"}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 200, "Multi-timeframe endpoint must respond HTTP 200"
              payload = json.loads(response.read().decode("utf-8"))

          assert payload.get("signal") in {"BUY", "SELL", "NO_TRADE"}, "Unknown signal"
          assert payload.get("execution_enabled") is False, "Live execution must remain disabled"
          timeframes = payload.get("timeframes") or {}
          assert set(timeframes) == {"15m", "60m", "1d"}, "All three timeframes must be reported"

          def parse_utc(value):
              assert isinstance(value, str) and value, "Missing candle-close timestamp"
              parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              assert parsed.tzinfo is not None, "Timestamp must include timezone"
              return parsed.astimezone(timezone.utc)

          for interval, data in timeframes.items():
              consensus = data.get("source_consensus") or {}
              diagnostics = consensus.get("provider_diagnostics") or []
              assert consensus.get("required_providers") == ["XAUS", "BIQUOTE"], interval
              assert len(diagnostics) in {0, 1, 2}, interval
              for provider in diagnostics:
                  assert provider.get("provider") in {"XAUS", "BIQUOTE"}, interval
                  age = provider.get("age_seconds")
                  limit = provider.get("freshness_limit_seconds")
                  assert isinstance(age, (int, float)) and math.isfinite(age) and age >= 0, interval
                  assert isinstance(limit, (int, float)) and math.isfinite(limit) and limit > 0, interval
                  assert age <= limit, "Provider freshness limit exceeded: " + interval
                  parse_utc(provider.get("last_candle_close_at"))
              print("TIMEFRAME", interval, json.dumps({
                  "signal": data.get("signal"),
                  "source_quality": data.get("source_quality"),
                  "consensus": consensus.get("status"),
                  "providers": diagnostics,
                  "data_quality": data.get("data_quality"),
                  "reason": data.get("reason"),
                  "provider_errors": consensus.get("errors"),
                  "max_ohlc_spread_pct": consensus.get("max_ohlc_spread_pct")
              }, ensure_ascii=False))

          if payload["signal"] in {"BUY", "SELL"}:
              assert payload.get("signal_quality", {}).get("status") == "PASSED"
              assert payload.get("signal_stability", {}).get("status") == "CONFIRMED"
              assert payload.get("signal_stability", {}).get("confirmed") is True
              assert payload.get("signal_stability", {}).get("confirmations") >= 2
              for interval, data in timeframes.items():
                  assert data.get("source_quality") == "CONVERGED", interval
                  assert data.get("data_quality", {}).get("status") == "CLEAN", interval
                  assert data.get("source_consensus", {}).get("status") == "CONVERGED", interval
                  assert len(data.get("source_consensus", {}).get("provider_diagnostics", [])) == 2, interval
              assert payload.get("market_data_status") == "LIVE"
              assert len(payload.get("market_sources", [])) == 3
              print("DIRECTIONAL_SIGNAL_FULLY_VERIFIED", payload["signal"])
          else:
              assert payload.get("confidence", 0) == 0, "Blocked signal must have zero confidence"
              print("NO_TRADE_FAIL_CLOSED", json.dumps({
                  "blocked_reasons": payload.get("signal_quality", {}).get("blocked_reasons"),
                  "market_data_status": payload.get("market_data_status"),
                  "stability": payload.get("signal_stability", {}).get("status")
              }, ensure_ascii=False))

          print("CONSENSUS_SAFETY_GATE_OK")
          PY
