name: Ayyar Smart Trader CI


on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=. pytest -q

  android-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null
      - name: Build debug APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayyar-smart-trader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  worker-tests:
    name: Cloudflare Worker tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker test dependencies
        run: npm install --prefix cloudflare --no-audit --no-fund
      - name: Run Worker unit tests
        run: npm test --prefix cloudflare
      - name: Run SQLite Durable Object transaction integration tests
        run: npm run test:integration --prefix cloudflare
      - name: Validate Cloudflare Worker bundle and Durable Object export
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.jsonc

  production-smoke:
    name: Production API smoke tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Worker health and safety endpoints
        env:
          API_BASE: https://ayyar-smart-trader-api.ayyar-smart-trader.workers.dev
        run: |
          python - <<'PY'
          import json, os, urllib.request

          base = os.environ["API_BASE"].rstrip("/")

          def get(path):
              req = urllib.request.Request(base + path, headers={
                  "Accept": "application/json",
                  "User-Agent": "AyyarSmartTrader-ProductionSmoke/1.0"
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if response.status != 200:
                          raise RuntimeError(f"{path}: unexpected HTTP {response.status}")
                      return json.loads(response.read())
              except urllib.error.HTTPError as error:
                  body = error.read(2000).decode("utf-8", errors="replace")
                  raise RuntimeError(f"{path}: HTTP {error.code}; response={body}") from error

          health = get("/health")
          assert health.get("status") == "ok", health
          assert health.get("service") == "ayyar-smart-trader-api", health

          market = get("/v1/market/status")
          assert market.get("status") in {"LIVE", "PARTIAL", "UNAVAILABLE"}, market
          assert isinstance(market.get("live_quotes"), int), market
          assert isinstance(market.get("total_quotes"), int) and market["total_quotes"] > 0, market

          policy = get("/v1/risk/policy")
          assert policy.get("execution_enabled") is False, policy
          assert policy.get("default_risk_per_trade") <= 0.01, policy
          assert policy.get("max_daily_loss") <= 0.03, policy
          assert policy.get("max_drawdown") <= 0.08, policy

          monitor = get("/v1/paper/monitor/status")
          assert monitor.get("execution_enabled") is False, monitor
          assert monitor.get("mode") == "PAPER_ONLY", monitor

          candle_req = urllib.request.Request(base + "/v1/market/candles?symbol=xau&interval=15m",
              headers={"Accept": "application/json", "User-Agent": "AyyarSmartTrader-ProductionSmoke/1.0"})
          try:
              with urllib.request.urlopen(candle_req, timeout=20) as response:
                  candles = json.loads(response.read())
          except urllib.error.HTTPError as error:
              candles = json.loads(error.read().decode("utf-8", errors="replace"))

          print(json.dumps({
              "health": health["status"],
              "market_status": market["status"],
              "live_quotes": market["live_quotes"],
              "total_quotes": market["total_quotes"],
              "no_key_provider_probes": probe_results,
              "xau_15m_candles": {
                  "status": candles.get("status"),
                  "provider": candles.get("provider"),
                  "last_candle_at": candles.get("last_candle_at"),
                  "age_seconds": candles.get("age_seconds"),
                  "error": candles.get("error")
              },
              "paper_monitor_status": monitor.get("status"),
              "paper_monitor_error": (monitor.get("monitor") or {}).get("error"),
              "execution_enabled": policy["execution_enabled"]
          }, ensure_ascii=False))
          PY
