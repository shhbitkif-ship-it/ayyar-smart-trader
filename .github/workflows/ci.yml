name: Ayyar Smart Trader CI


on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=. pytest -q

  android-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null
      - name: Build debug APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ayyar-smart-trader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  worker-tests:
    name: Cloudflare Worker tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker test dependencies
        run: npm install --prefix cloudflare --no-audit --no-fund
      - name: Run Worker unit tests
        run: npm test --prefix cloudflare
      - name: Run SQLite Durable Object transaction integration tests
        run: npm run test:integration --prefix cloudflare
      - name: Validate Cloudflare Worker bundle and Durable Object export
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.jsonc

  production-smoke:
    name: Production API smoke tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Worker health and safety endpoints
        env:
          API_BASE: https://ayyar-smart-trader-api.ayyar-smart-trader.workers.dev
        run: |
          python - <<'PY'
          import json, os, urllib.request

          base = os.environ["API_BASE"].rstrip("/")

          def get(path):
              req = urllib.request.Request(base + path, headers={
                  "Accept": "application/json",
                  "User-Agent": "AyyarSmartTrader-ProductionSmoke/1.0"
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if response.status != 200:
                          raise RuntimeError(f"{path}: unexpected HTTP {response.status}")
                      return json.loads(response.read())
              except urllib.error.HTTPError as error:
                  body = error.read(2000).decode("utf-8", errors="replace")
                  raise RuntimeError(f"{path}: HTTP {error.code}; response={body}") from error

          health = get("/health")
          assert health.get("status") == "ok", health
          assert health.get("service") == "ayyar-smart-trader-api", health

          market = get("/v1/market/status")
          assert market.get("status") in {"LIVE", "PARTIAL", "UNAVAILABLE"}, market
          assert isinstance(market.get("live_quotes"), int), market
          assert isinstance(market.get("total_quotes"), int) and market["total_quotes"] > 0, market

          policy = get("/v1/risk/policy")
          assert policy.get("execution_enabled") is False, policy
          assert policy.get("default_risk_per_trade") <= 0.01, policy
          assert policy.get("max_daily_loss") <= 0.03, policy
          assert policy.get("max_drawdown") <= 0.08, policy

          monitor = get("/v1/paper/monitor/status")
          assert monitor.get("execution_enabled") is False, monitor
          assert monitor.get("mode") == "PAPER_ONLY", monitor

          probes = {
              "xaus_intraday_48h": "https://xaus.com/api/v1/intraday?symbol=xau&hours=48",
              "biquote_xauusd_15m": "https://biquote.io/api/XAUUSD/ohlc?interval=15m&limit=200",
              "biquote_xauusd_1h": "https://biquote.io/api/XAUUSD/ohlc?interval=1h&limit=200",
              "biquote_xauusd_1d": "https://biquote.io/api/XAUUSD/ohlc?interval=1d&limit=200"
          }
          probe_results = {}
          for name, url in probes.items():
              req = urllib.request.Request(url, headers={
                  "Accept": "application/json,text/csv,*/*",
                  "User-Agent": "Mozilla/5.0 AyyarSmartTrader/1.0"
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      raw = response.read(100000).decode("utf-8", errors="replace")
                      if name.startswith("xaus_intraday"):
                          data = json.loads(raw)
                          points = sorted((point for point in (data.get("points") or []) if point.get("t") is not None),
                              key=lambda point: float(point["t"]))
                          times = [float(point["t"]) for point in points]
                          deltas = [right-left for left,right in zip(times,times[1:])]
                          buckets = {}
                          for point in points:
                              bucket = int(float(point["t"]) // 900)
                              buckets[bucket] = buckets.get(bucket,0) + 1
                          probe_results[name] = {
                              "http": response.status, "data_state": data.get("data_state"),
                              "coverage_seconds": data.get("coverage_seconds"), "rows": len(points),
                              "median_sample_seconds": sorted(deltas)[len(deltas)//2] if deltas else None,
                              "max_sample_gap_seconds": max(deltas,default=0),
                              "sample_gaps_over_5m": sum(1 for delta in deltas if delta>300),
                              "15m_buckets": len(buckets),
                              "minimum_samples_per_bucket": min(buckets.values(),default=0),
                              "last_points": points[-4:]
                          }
                      elif name.startswith("biquote"):
                          data = json.loads(raw)
                          bars = data.get("bars") or []
                          closed = [bar for bar in bars if bar.get("isOpen") is False]
                          parsed = sorted((bar for bar in closed if bar.get("openTime")),
                              key=lambda bar: bar["openTime"])
                          interval_seconds = {"15m": 900, "30m": 1800, "1h": 3600, "4h": 14400, "1d": 86400}.get(data.get("interval"), 0)
                          gaps = []
                          for left, right in zip(parsed, parsed[1:]):
                              delta = ( __import__("datetime").datetime.fromisoformat(right["openTime"].replace("Z","+00:00")) -
                                        __import__("datetime").datetime.fromisoformat(left["openTime"].replace("Z","+00:00")) ).total_seconds()
                              if interval_seconds and delta > interval_seconds * 1.01:
                                  gaps.append({"from": left["openTime"], "to": right["openTime"],
                                      "intervals": round(delta / interval_seconds, 2)})
                          latest_closed = closed[0] if closed else None
                          probe_results[name] = {
                              "http": response.status, "symbol": data.get("symbol"),
                              "interval": data.get("interval"), "rows": len(bars),
                              "closed_rows": len(closed), "latest_closed_bar": latest_closed,
                              "gap_count": len(gaps),
                              "largest_gap_intervals": max((gap["intervals"] for gap in gaps), default=0),
                              "gap_examples": gaps[:8]
                          }
                      elif "yahoo" in name:
                          data = json.loads(raw)
                          result = (data.get("chart") or {}).get("result") or []
                          if result:
                              timestamps = result[0].get("timestamp") or []
                              result_meta = result[0].get("meta") or {}
                              probe_results[name] = {"http": response.status, "rows": len(timestamps),
                                  "currency": result_meta.get("currency"), "exchange": result_meta.get("exchangeName"),
                                  "last_timestamp": timestamps[-1] if timestamps else None}
                          else:
                              probe_results[name] = {"http": response.status, "rows": 0,
                                  "error": (data.get("chart") or {}).get("error")}
                      else:
                          probe_results[name] = {"http": response.status, "sample": raw[:350]}
              except Exception as error:
                  probe_results[name] = {"error": str(error)[:300]}

          candle_req = urllib.request.Request(base + "/v1/market/candles?symbol=xau&interval=15m",
              headers={"Accept": "application/json", "User-Agent": "AyyarSmartTrader-ProductionSmoke/1.0"})
          try:
              with urllib.request.urlopen(candle_req, timeout=20) as response:
                  candles = json.loads(response.read())
          except urllib.error.HTTPError as error:
              candles = json.loads(error.read().decode("utf-8", errors="replace"))

          candle_status = candles.get("status")
          if candle_status in {"LIVE", "PARTIAL"}:
              assert candles.get("provider") in {"XAUS", "BIQUOTE"}, candles
              assert len(candles.get("candles", [])) >= 60, candles
              quality_status = candles.get("data_quality", {}).get("status")
              assert quality_status in {"CLEAN", "GAPS_DETECTED"}, candles
              if candles.get("provider") == "BIQUOTE":
                  assert candles.get("fallback_reason"), candles
          else:
              # A stale or unavailable provider is an expected market-data condition,
              # not a healthy feed. The API must fail closed and never fabricate candles.
              assert candle_status == "UNAVAILABLE", candles
              assert candles.get("candles") == [], candles
              assert candles.get("execution_enabled") is False, candles
              print("WARNING: verified OHLC feed unavailable; signal generation must remain NO_TRADE.")

          print(json.dumps({
              "health": health["status"],
              "market_status": market["status"],
              "live_quotes": market["live_quotes"],
              "total_quotes": market["total_quotes"],
              "no_key_provider_probes": probe_results,
              "xau_15m_candles": {
                  "status": candles.get("status"),
                  "provider": candles.get("provider"),
                  "last_candle_at": candles.get("last_candle_at"),
                  "age_seconds": candles.get("age_seconds"),
                  "fallback_reason": candles.get("fallback_reason"),
                  "data_quality": candles.get("data_quality"),
                  "error": candles.get("error")
              },
              "paper_monitor_status": monitor.get("status"),
              "paper_monitor_error": (monitor.get("monitor") or {}).get("error"),
              "execution_enabled": policy["execution_enabled"]
          }, ensure_ascii=False))
          PY
