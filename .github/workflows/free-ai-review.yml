name: Ayyar Free AI Specialist Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ayyar-ai-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  specialist-review:
    name: Free multi-role AI review (Groq)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_REVIEW_MODEL: openai/gpt-oss-120b
      GROQ_CROSSCHECK_MODEL: qwen/qwen3.8-27b
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Fetch safe, text-only pull request patches
        id: patches
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["REPOSITORY"]; number=os.environ["PR_NUMBER"]
          url=f"https://api.github.com/repos/{repo}/pulls/{number}/files?per_page=100"
          req=urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              files=json.load(r)
          excluded=(".env", "secrets", "credentials", "lock", ".png", ".jpg", ".jpeg", ".webp", ".pdf", ".apk")
          chunks=[]
          for f in files:
              path=f.get("filename","")
              if any(x in path.lower() for x in excluded) or not f.get("patch"):
                  continue
              chunks.append(f"\n--- FILE: {path} ({f.get('status','modified')}) ---\n{f['patch']}")
          patch="\n".join(chunks)[:26000]
          if not patch.strip():
              raise SystemExit("No eligible text patches found; review not sent.")
          # Preserve GitHub Actions expressions: the generic secret-name
          # redactor must never rewrite syntax such as ${{ secrets.NAME }}.
          import re
          gha_expressions=[]
          def protect_expression(match):
              gha_expressions.append(match.group(0))
              return f"__GHA_EXPRESSION_{len(gha_expressions)-1}__"
          patch=re.sub(r"\$\{\{.*?\}\}", protect_expression, patch, flags=re.S)
          # Redact common credential assignments and bearer values before transmission.
          patch=re.sub(r'(?i)(api[_-]?key|token|secret|password)(\s*[:=]\s*)(?!__GHA_EXPRESSION_\d+__)[^\s,;]+', r'\1\2[REDACTED]', patch)
          patch=re.sub(r'(?i)(Bearer\s+)[A-Za-z0-9._~+/-]+=*', r'\1[REDACTED]', patch)
          # Mask high-confidence raw credential formats even when not assigned
          # to a variable (for example provider keys, PATs, and private keys).
          high_confidence_patterns = [
              r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----.*?-----END (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              r'\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b',
              r'\bAKIA[0-9A-Z]{16}\b',
              r'\bgsk_[A-Za-z0-9]{20,}\b',
              r'\bsk-[A-Za-z0-9_-]{20,}\b',
              r'\bxox[baprs]-[A-Za-z0-9-]{10,}\b'
          ]
          for pattern in high_confidence_patterns:
              patch=re.sub(pattern, "[REDACTED_HIGH_CONFIDENCE_SECRET]", patch, flags=re.S)
          # Restore non-secret workflow expressions after redaction.
          for index, expression in enumerate(gha_expressions):
              patch=patch.replace(f"__GHA_EXPRESSION_{index}__", expression)
          open("review-patch.txt","w",encoding="utf-8").write(patch)
          print(f"Prepared {len(chunks)} text patches ({len(patch)} chars); excluded secret/config/binary paths.")
          PY
      - name: Explain missing free-provider credential
        if: env.GROQ_API_KEY == ''
        run: |
          echo "::notice title=AI reviewers not connected::Add GROQ_API_KEY in GitHub repository Settings > Secrets and variables > Actions. No paid fallback is configured."
      - name: Run independent specialist reviews
        if: env.GROQ_API_KEY != ''
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error
          patch=open("review-patch.txt",encoding="utf-8").read()
          endpoint="https://api.groq.com/openai/v1/chat/completions"
          auth="Bearer "+os.environ["GROQ_API_KEY"]
          # Preflight the credential and model catalogue before sending review content.
          probe=urllib.request.Request("https://api.groq.com/openai/v1/models",headers={"Authorization":auth,"User-Agent":"AyyarSmartTrader-Review/1.0"})
          try:
              with urllib.request.urlopen(probe,timeout=30) as response:
                  catalogue=json.load(response)
          except urllib.error.HTTPError as e:
              detail=e.read(2000).decode("utf-8","replace")
              raise SystemExit(f"Groq credential/model-catalogue preflight failed: HTTP {e.code}: {detail[:1200]}")
          available={item.get("id") for item in catalogue.get("data",[])}
          required={os.environ["GROQ_REVIEW_MODEL"],os.environ["GROQ_CROSSCHECK_MODEL"]}
          missing=sorted(required-available)
          if missing:
              raise SystemExit("Configured Groq model IDs are not available to this key: "+", ".join(missing))
          roles=[
            ("Data quality specialist", "Audit data contracts, OHLC validity, timestamps, completed-candle freshness, missing intervals, provider fallback, and fail-closed behavior. Find concrete defects only."),
            ("Quant and backtesting specialist", "Audit signal logic, look-ahead bias, candle alignment, walk-forward splits, leakage, transaction costs, and statistical validity. Find concrete defects only."),
            ("Risk and security specialist", "Audit risk limits, execution-disabled guarantees, secrets handling, unsafe defaults, API security, and failure modes. Find concrete defects only.")
          ]
          def ask(model, role, instruction):
              body={
                "model":model,
                "temperature":0.1,
                "max_tokens":1100,
                "messages":[
                  {"role":"system","content":"You are a skeptical senior code reviewer for a paper-trading-only market analytics system. Review only the supplied diff. Do not invent runtime facts. Separate verified findings from hypotheses. Treat [REDACTED] and __GHA_EXPRESSION_n__ markers as sanitization placeholders, not literal source syntax; do not report syntax defects based only on those markers. If source context is insufficient, say so. Return at most 5 concise findings; for each include severity, file/area, evidence, impact, and a testable fix. Never recommend enabling live execution."},
                  {"role":"user","content":f"Role: {role}. Task: {instruction}\nReview only this pull-request patch. State limitations if context is insufficient.\n\nPATCH:\n{patch}"}
                ]
              }
              req=urllib.request.Request(endpoint,data=json.dumps(body).encode(),headers={
                "Authorization":"Bearer "+os.environ["GROQ_API_KEY"],
                "Content-Type":"application/json",
                "User-Agent":"AyyarSmartTrader-Review/1.0"
              })
              # Free-tier TPM limits can be reached even when daily quota remains.
              # Retry 429 responses with bounded backoff; never switch to a paid tier.
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=90) as r:
                          data=json.load(r)
                      return data["choices"][0]["message"]["content"]
                  except urllib.error.HTTPError as e:
                      detail=e.read(2000).decode("utf-8","replace")
                      if e.code == 429 and attempt < 4:
                          import time
                          wait=min(60, 15 * (2 ** attempt))
                          match=re.search(r"try again in ([0-9.]+)s",detail,re.I)
                          if match:
                              wait=max(wait,float(match.group(1))+2)
                          print(f"Groq rate limit for {model}; retry {attempt+1}/4 after {wait:.1f}s.")
                          time.sleep(wait)
                          continue
                      raise SystemExit(f"Groq chat request failed for model {model}: HTTP {e.code}: {detail[:1200]}")
              raise SystemExit(f"Groq chat request exhausted retries for model {model}.")
          reports=[]
          import time
          for index,(role,instruction) in enumerate(roles):
              reports.append((role,ask(os.environ["GROQ_REVIEW_MODEL"],role,instruction)))
              if index < len(roles)-1:
                  time.sleep(30)  # Stay within the free-tier rolling TPM window.
          time.sleep(30)
          reports.append(("Independent cross-check (Qwen)",ask(
              os.environ["GROQ_CROSSCHECK_MODEL"],
              "Independent skeptical reviewer",
              "Challenge the prior assumptions by reviewing the same patch independently. Focus on missed edge cases, false positives, and unsupported claims. Return only the most important issues."
          )))
          with open("ai-review-report.md","w",encoding="utf-8") as f:
              f.write("# Ayyar Smart Trader — AI specialist review\n\n")
              f.write("**Advisory only.** AI output is not approval, test evidence, or a trading signal. Human/code-test verification is mandatory. Live execution must remain disabled.\n\n")
              for role,report in reports:
                  f.write(f"## {role}\n\n{report}\n\n")
          print("Completed 4 role-separated reviews; report saved.")
          PY
      - name: Upload specialist report
        if: env.GROQ_API_KEY != ''
        uses: actions/upload-artifact@v7
        with:
          name: ayyar-ai-review-pr-${{ inputs.pr_number }}
          path: ai-review-report.md
          if-no-files-found: error
          retention-days: 7
